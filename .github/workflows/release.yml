name: Release (auto-build on push)

on:
  push:
    branches: [master, v8b-nds-editor]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (v8b)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleFreeDynamic --no-daemon

      - name: Rename APK with version
        id: ver
        run: |
          set -e
          VER=$(grep -m1 'versionName = "' lemuroid-app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          APK=lemuroid-app/build/outputs/apk/freeDynamic/release/lemuroid-app-free-dynamic-release.apk
          ls -la "$APK"
          mkdir -p dist
          cp "$APK" "dist/Lemuroid-NDS-${VER}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "apk_name=Lemuroid-NDS-${VER}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-apk
          path: dist/
          retention-days: 90

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lemuroid-apk
          path: dist/

      - name: "Publish GitHub Release (tag latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Lemuroid NDS — latest build
          files: |
            dist/Lemuroid-*.apk
            dist/SHA256SUMS.txt
          overwrite: true
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            自动构建（GitHub Actions）。

            安装：下载 APK 后在 Android 上直接安装，需开启"允许安装未知来源应用"。
            校验：`sha256sum -c SHA256SUMS.txt`
