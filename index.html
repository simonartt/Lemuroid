<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemuroid V8A 下载 — GitHub Actions 自动构建</title>
<style>
  :root {
    --bg: #333;
    --panel: #2a2a2a;
    --accent: #99FF00;
    --text: #e8e8e8;
    --muted: #999;
    --border: #444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container { max-width: 760px; width: 100%; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .meta {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .meta b { color: var(--text); font-weight: 600; }
  .status-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-info { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .glyph { font-size: 26px; color: var(--accent); width: 34px; text-align: center; flex-shrink: 0; }
  .card-name { font-size: 15px; font-weight: 600; word-break: break-all; }
  .card-size { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn:hover { filter: brightness(1.1); }
  .loading, .error { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .error { color: #ff6b6b; }
  footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--muted); line-height: 1.8; }
  footer a { color: var(--accent); text-decoration: none; }
  code { background: #222; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>Lemuroid <span>V8A</span></h1>
  <p class="subtitle">定制版 Android 模拟器（双屏 / 虚拟键 / 悬浮菜单）· GitHub Actions 自动构建</p>

  <div class="status-bar"><div class="dot"></div><span id="status-text">加载中…</span></div>
  <div class="meta" id="meta"></div>

  <div id="content"><div class="loading">正在获取最新构建…</div></div>

  <footer>
    构建流程：<a href="https://github.com/simonartt/Lemuroid/actions">GitHub Actions</a> ·
    源码：<a href="https://github.com/simonartt/Lemuroid">simonartt/Lemuroid</a><br>
    安装：下载 APK 后在 Android 上直接安装，需开启"允许安装未知来源应用"<br>
    校验：<code>sha256sum -c SHA256SUMS.txt</code>
  </footer>
</div>

<script>
const API = "https://api.github.com/repos/simonartt/Lemuroid/releases?per_page=1";

function fmtSize(bytes) {
  if (!bytes) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + " " + units[i];
}

async function load() {
  const statusEl = document.getElementById("status-text");
  const contentEl = document.getElementById("content");
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const list = await res.json();
    const rel = Array.isArray(list) ? list[0] : list;
    if (!rel) throw new Error("No release yet");

    statusEl.textContent = "最新构建已就绪";
    const meta = document.getElementById("meta");
    meta.style.display = "block";
    meta.innerHTML = "版本 <b>" + (rel.name || "") + "</b> · 更新于 <b>" +
      new Date(rel.published_at).toLocaleString("zh-CN") + "</b>";

    const assets = rel.assets || [];
    if (!assets.length) {
      contentEl.innerHTML = '<div class="loading">暂无可下载文件</div>';
      return;
    }

    let html = "";
    for (const a of assets) {
      const isApk = a.name.toLowerCase().endsWith(".apk");
      const glyph = isApk ? "\u25A0" : "\u25C6";
      html += '<div class="card">' +
        '<div class="card-info"><div class="glyph">' + glyph + '</div>' +
        '<div><div class="card-name">' + a.name + '</div>' +
        '<div class="card-size">' + fmtSize(a.size) + ' · ' + (a.download_count || 0) + ' 次下载</div></div></div>' +
        '<a class="btn" href="' + a.browser_download_url + '">下载</a></div>';
    }
    contentEl.innerHTML = html;
  } catch (e) {
    statusEl.textContent = "加载失败";
    contentEl.innerHTML = '<div class="error">获取构建信息失败：' + e.message +
      '<br><br>构建可能正在进行中，稍后刷新本页。</div>';
  }
}
load();
</script>
</body>
</html>
